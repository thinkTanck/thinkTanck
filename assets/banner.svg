<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title desc">
  <title id="title">thinkTanck banner</title>
  <desc id="desc">A slim dark banner with flowing green waves in the thinkTanck palette.</desc>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#3fcf8e" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3fcf8e"/>
      <stop offset="0.65" stop-color="#6ee7b7"/>
      <stop offset="1"    stop-color="#6ee7b7" stop-opacity="0">
        <animate attributeName="offset" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="drift" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fcf8e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#3fcf8e" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1200 0; 1200 0; -1200 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="118" rx="24" fill="#0a0a0a" stroke="#222222" stroke-width="2"/>

  <!-- back wave (dim) -->
  <path d="M0,66 Q75,44 150,66 T300,66 T450,66 T600,66 T750,66 T900,66 T1050,66 T1200,66"
        fill="none" stroke="#1d7a52" stroke-width="2" opacity="0.5"/>
  <!-- mid wave (static green) -->
  <path d="M0,60 Q75,36 150,60 T300,60 T450,60 T600,60 T750,60 T900,60 T1050,60 T1200,60"
        fill="none" stroke="#3fcf8e" stroke-width="2.5" opacity="0.35"/>
  <!-- front wave (animated drifting highlight) -->
  <path d="M0,60 Q75,36 150,60 T300,60 T450,60 T600,60 T750,60 T900,60 T1050,60 T1200,60"
        fill="none" stroke="url(#drift)" stroke-width="2.5"/>

  <!-- soft dots on the crests -->
  <g fill="#3fcf8e">
    <circle cx="150" cy="60" r="2.5" opacity="0.6"/>
    <circle cx="450" cy="60" r="2.5" opacity="0.6"/>
    <circle cx="750" cy="60" r="2.5" opacity="0.6"/>
    <circle cx="1050" cy="60" r="2.5" opacity="0.6"/>
  </g>
</svg>
